<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reward City · Hero</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e4e1da; font: 14px/1.3 system-ui, sans-serif; color: #2b2f7a; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; user-select: none; }
  #ui button { border: 0; border-radius: 8px; padding: 8px 12px; background: #ffffffd9; color: #2b2f7a; cursor: pointer; font-weight: 600; touch-action: none; }
  #ui button.on { background: #3A43C4; color: #fff; }
  #meter { position: fixed; left: 16px; bottom: 16px; width: 26px; height: 120px; border-radius: 13px; background: #ffffff99; overflow: hidden; box-shadow: inset 0 0 0 2px #3A43C455; }
  #meterFill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#FFD401, #F5A700); }
  #info { position: fixed; left: 54px; bottom: 16px; opacity: .85; }
  #hits { position: fixed; right: 16px; bottom: 16px; font-weight: 700; font-size: 18px; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/jsm/" } }</script>
</head>
<body>
<div id="ui">
  <button data-k="left">◀ walk</button><button data-k="right">walk ▶</button><button data-k="jump">jump</button>
  <button data-k="beam">redeem / dance (hold J)</button><button data-k="play">play (hold K)</button><button id="reset">reset card</button>
</div>
<div id="meter"><div id="meterFill"></div></div>
<div id="info">← → walk · space jump · hold J beam · stand in the kiosk to play</div>
<div id="hits"></div>
<script type="module">
import * as THREE from 'three';
import { loadHero } from '../src/hero.js';
import { CoinRenderer } from '../src/coins.js';
import { Meter, launch, stepCoin, hitsBox, coinDone } from '../src/coinsim.js';
import { TUNING, BEAM } from '../src/config.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e4e1da');
scene.fog = new THREE.Fog('#e4e1da', 9, 30);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 100);
const camDist = +(q.get('dist') || 5.2);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

scene.add(new THREE.HemisphereLight(0xfff8ee, 0x8a8a90, 1.7));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.2);
sun.position.set(-3, 6, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -2 });
scene.add(sun, sun.target);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 6), new THREE.MeshStandardMaterial({ color: 0xc9c5bc, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.position.z = -1; floor.receiveShadow = true; scene.add(floor);

// kiosk placeholder
const KX = -2.5;
const kiosk = new THREE.Group();
const kBody = new THREE.Mesh(new THREE.BoxGeometry(0.62, 1.5, 0.45), new THREE.MeshStandardMaterial({ color: 0x3A43C4, roughness: 0.6 }));
kBody.position.y = 0.75; kBody.castShadow = true;
const kScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.36), new THREE.MeshBasicMaterial({ color: 0x9fb0ff, toneMapped: false }));
kScreen.position.set(0, 1.12, 0.23);
kiosk.add(kBody, kScreen); kiosk.position.set(KX, 0, -0.55); scene.add(kiosk);

// locked card placeholder
const CX = +(q.get('cardx') || 3);
const lockTex = makeLockTexture();
const amazon = await new THREE.TextureLoader().loadAsync('../assets/cards/amazon.webp'); amazon.colorSpace = THREE.SRGBColorSpace;
const card = new THREE.Group();
const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.75, 10), new THREE.MeshStandardMaterial({ color: 0x8d8a84 }));
post.position.y = 0.375; post.castShadow = true;
const face = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.62), new THREE.MeshBasicMaterial({ map: lockTex, transparent: true }));
face.position.y = 1.06;
card.add(post, face); card.position.set(CX, 0, -0.1); scene.add(card);
const cardBox = { x0: CX - 0.5, x1: CX + 0.5, y0: 0.7, y1: 1.4 };
let hits = +(q.get('hits') || 0), popT = -1;

const screenTex = await new THREE.TextureLoader().loadAsync('../assets/ui/phone-screen.webp');
const hero = await loadHero(screenTex, q.get('glb') || '../assets/models/hero.glb');
scene.add(hero.root);
if (q.has('noik')) hero.ik = false;
if (q.has('bind')) { hero.animate = false; hero.mixer.stopAllAction(); }
const coinsR = new CoinRenderer(); scene.add(coinsR.mesh);
const coins = [];
const meter = new Meter(+(q.get('meter') ?? 100));

const S = { x: +(q.get('x') || 0), y: 0, vx: 0, vy: 0, facing: +(q.get('face') || 1), onGround: true, beam: false, play: false, cheer: false, cheerT: 0 };
const keys = new Set(), held = new Set();
if (q.has('beam')) held.add('beam');
if (q.has('play')) held.add('play');
if (q.has('walk')) held.add(+q.get('walk') < 0 ? 'left' : 'right');
addEventListener('keydown', e => { keys.add(e.code); if (e.code === 'Space') jumpReq = true; });
addEventListener('keyup', e => keys.delete(e.code));
let jumpReq = false, camOff = S.facing * 0.6;
for (const b of document.querySelectorAll('#ui button[data-k]')) {
  const k = b.dataset.k;
  const on = (e) => { e.preventDefault(); if (k === 'jump') jumpReq = true; else held.add(k); b.classList.add('on'); };
  const off = () => { held.delete(k); b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off);
}
document.getElementById('reset').onclick = () => { hits = 0; popT = -1; face.material.map = lockTex; face.scale.setScalar(1); };

const left = () => keys.has('ArrowLeft') || keys.has('KeyA') || held.has('left');
const right = () => keys.has('ArrowRight') || keys.has('KeyD') || held.has('right');
const beamKey = () => keys.has('KeyJ') || keys.has('ShiftLeft') || keys.has('ShiftRight') || held.has('beam');
const playKey = () => keys.has('KeyK') || held.has('play');

function step(dt) {
  const ix = (right() ? 1 : 0) - (left() ? 1 : 0);
  S.beam = beamKey();
  const atKiosk = Math.abs(S.x - KX) < 0.6 && S.onGround;
  S.play = !S.beam && (playKey() || (atKiosk && ix === 0 && !meter.full));
  if (ix) S.facing = ix;
  const maxV = S.beam ? TUNING.walkBeam : TUNING.walk;
  S.vx += (ix * maxV - S.vx) * (1 - Math.exp(-(ix ? 10 : 14) * dt));
  if (S.play) S.vx *= 0.8;
  if (jumpReq && S.onGround) { S.vy = TUNING.jump; S.onGround = false; }
  jumpReq = false;
  S.vy -= TUNING.gravity * dt;
  S.x += S.vx * dt; S.y += S.vy * dt;
  if (S.y <= 0) { S.y = 0; S.vy = 0; S.onGround = true; }
  if (S.play) meter.refill(dt);
  if (S.cheerT > 0) S.cheerT -= dt;
  S.cheer = S.cheerT > 0;

  hero.sync(S, dt);
  if (S.beam) {
    const n = meter.beam(dt);
    for (let i = 0; i < n; i++) coins.push(launch({ x: hero.spout.x, y: hero.spout.y, z: hero.spout.z }, S.facing, Math.random, popT < 0 ? { x: CX + (Math.random() - 0.5) * 0.6, y: 1.06 + (Math.random() - 0.5) * 0.3 } : null));
  }
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    stepCoin(c, dt);
    if (popT < 0 && hitsBox(c, cardBox)) { hits++; if (hits >= BEAM.need) { popT = 0; face.material.map = amazon; S.cheerT = 1.8; } }
    if (coinDone(c)) coins.splice(i, 1);
  }
  if (popT >= 0) { popT += dt; const t = Math.min(1, popT / 0.5); face.scale.setScalar(1 + Math.sin(t * Math.PI) * 0.35); face.position.y = 1.06 + Math.sin(t * Math.PI) * 0.15; }
  else face.position.x = Math.sin(performance.now() * 0.06) * Math.min(0.02, hits * 0.0015) * (S.beam ? 1 : 0);
  kScreen.material.color.setScalar(S.play ? 1.3 + 0.3 * Math.sin(performance.now() * 0.02) : 0.9);

  camOff += (S.facing * 0.6 - camOff) * (1 - Math.exp(-3 * dt));
  camera.position.set(S.x + camOff, 1.05, camDist);
  camera.lookAt(S.x + camOff, 0.62, 0);
  sun.position.set(S.x - 3, 6, 5); sun.target.position.set(S.x, 0, 0);
  coinsR.draw(coins);
  document.getElementById('meterFill').style.height = meter.value + '%';
  document.getElementById('hits').textContent = popT >= 0 ? 'unlocked!' : `card ${hits} / ${BEAM.need}`;
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  step(dt);
  renderer.render(scene, camera);
});
window.__viewer = { ready: true, S, meter, coins, hero, get hits() { return hits; } };

function makeLockTexture() {
  const c = document.createElement('canvas'); c.width = 380; c.height = 248;
  const x = c.getContext('2d');
  x.fillStyle = '#9d9a94'; roundRect(x, 4, 4, 372, 240, 26); x.fill();
  x.strokeStyle = '#7d7a75'; x.lineWidth = 6; roundRect(x, 4, 4, 372, 240, 26); x.stroke();
  x.fillStyle = '#6f6c67'; roundRect(x, 160, 112, 60, 50, 8); x.fill();
  x.strokeStyle = '#6f6c67'; x.lineWidth = 12; x.beginPath(); x.arc(190, 112, 20, Math.PI, 0); x.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function roundRect(x, l, t, w, h, r) { x.beginPath(); x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r); x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath(); }
</script>
</body>
</html>
